project = "LaughingMan"
schema  = 1

# Overlay: tighten the comment-ratio and file-length fleet defaults from advisory (warn) to blocker
# (error) for this repo; cyclomatic is already a fleet-default blocker. Same ids as release_gate's built-in defaults, so these override them
# (INSERT OR REPLACE, overlay layered last). Only the gate changes; thresholds match the defaults.

[[control]]
id        = "LaughingMan::default.comment-ratio"
title     = "No source file over the 10% comment-line cap"
assertion = "release_gate maintainability metric, promoted to blocker for LaughingMan."
theme     = "maintainability"
gate      = "blocker"
severity  = "low"
[control.check]
kind      = "complexity"
metric    = "comment_ratio"
scope     = "file_worst"
files     = ["src", "crates"]
predicate = "<= 0.10"

[[control]]
id        = "LaughingMan::default.file-length"
title     = "No source file over 800 lines"
assertion = "release_gate maintainability metric, promoted to blocker for LaughingMan."
theme     = "maintainability"
gate      = "blocker"
severity  = "low"
[control.check]
kind      = "complexity"
metric    = "loc"
scope     = "file_worst"
files     = ["src", "crates"]
predicate = "<= 800"

[[control]]
id        = "LaughingMan::default.pulumi"
title     = "No Pulumi infrastructure: a local desktop app with nothing to provision"
assertion = "release_gate Pulumi presence default, turned off for LaughingMan (not applicable)."
theme     = "other"
gate      = "advisory"
severity  = "low"
[control.check]
kind      = "pulumi"
policy    = "off"

